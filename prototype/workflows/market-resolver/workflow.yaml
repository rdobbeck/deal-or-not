specVersion: 1.0.0
name: deal-or-not-market-resolver
version: 1.0.0
owner: deal-or-not@example.com
description: Auto-resolves prediction markets when games complete

# Staging configuration (Base Sepolia)
staging:
  triggers:
    - type: EVENT_LOG
      config:
        network: base-sepolia
        address: "0xd9D4A974021055c46fD834049e36c21D7EE48137"  # DealOrNotConfidential
        eventSignature: "GameComplete(uint256,address,uint256)"
        confirmations: 2  # Wait for finality before resolving

  actions:
    - type: CRE_WORKFLOW
      config:
        runtime: bun
        entrypoint: src/index.ts
        secrets:
          - name: PRIVATE_KEY
            source: vault://deal-or-not/market-resolver-key
          - name: BASE_SEPOLIA_RPC
            source: vault://deal-or-not/base-rpc

    - type: WRITE_REPORT
      config:
        network: base-sepolia
        forwarder: "0x82300bd7c3958625581cc2F77bC6464dcEcDF3e5"
        receiver: "0x8606Ed23CBa4903e10F26Bc756E70d867dEDDcC4"  # PredictionMarket
        method: "resolveMarket(uint256,bool)"
        gasLimit: 200000

# Production configuration (Base Mainnet)
production:
  triggers:
    - type: EVENT_LOG
      config:
        network: base-mainnet
        address: "<MAINNET_DEAL_OR_NOT_ADDRESS>"
        eventSignature: "GameComplete(uint256,address,uint256)"
        confirmations: 3

  actions:
    - type: CRE_WORKFLOW
      config:
        runtime: bun
        entrypoint: src/index.ts
        secrets:
          - name: PRIVATE_KEY
            source: vault://deal-or-not/market-resolver-key-prod
          - name: BASE_RPC
            source: vault://deal-or-not/base-rpc-prod

    - type: WRITE_REPORT
      config:
        network: base-mainnet
        forwarder: "<MAINNET_KEYSTONE_FORWARDER>"
        receiver: "<MAINNET_PREDICTION_MARKET_ADDRESS>"
        method: "resolveMarket(uint256,bool)"
        gasLimit: 200000
